<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ADV Coffee</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg: #FBF3E9;
    --panel: #FFFFFF;
    --ink: #2C1B12;
    --muted: #8A7060;
    --line: #EADACA;
    --accent: #C1502E;
    --accent-dark: #9C3D22;
    --gold: #C98A2C;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 32px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .wrap {
    max-width: 420px;
    width: 100%;
  }

  header {
    text-align: center;
    margin-bottom: 36px;
  }

  .shop-name {
    font-family: 'DM Serif Display', serif;
    font-size: 44px;
    color: var(--accent-dark);
  }

  .tagline {
    font-size: 13px;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  a.side-card {
    display: block;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 26px 24px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 2px 10px rgba(44, 27, 18, 0.04);
  }

  a.side-card:active {
    transform: scale(0.98);
  }

  .side-icon {
    font-size: 28px;
    margin-bottom: 10px;
  }

  .side-title {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    color: var(--accent-dark);
    margin-bottom: 4px;
  }

  .side-desc {
    font-size: 14px;
    color: var(--muted);
  }

  .side-card.staff .side-icon { color: var(--accent); }
  .side-card.order .side-icon { color: var(--gold); }

  footer {
    text-align: center;
    margin-top: 32px;
    font-size: 12.5px;
    color: var(--muted);
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="shop-name">ADV Coffee</div>
    <div class="tagline">Choose a Screen</div>
  </header>

  <div class="cards">
    <a class="side-card order" href="order.html">
      <div class="side-icon">&#9749;</div>
      <div class="side-title">Place an Order</div>
      <div class="side-desc">For customers — order ahead and see when it's ready.</div>
    </a>

    <a class="side-card staff" href="staff.html">
      <div class="side-icon">&#128203;</div>
      <div class="side-title">Staff Dashboard</div>
      <div class="side-desc">For staff — manage the queue and mark orders done.</div>
    </a>
  </div>

  <footer>
    ADV Coffee Order Queue
  </footer>
</div>

</body>
</html>
